stages:
  - dast

dast_zap_baseline:
  stage: dast
  image: docker:29.8.2-cli
  services:
    - name: docker:29.8.2-dind
  variables:
    DOCKER_HOST: tcp://docker:2375
    DOCKER_TLS_CERTDIR: ""
  before_script:
    - apk add --no-cache git curl
    - git clone --depth 1 https://github.com/tombstoneghost/TIWAP.git tiwap
    - cp RENDU_FINAL/lab/docker-compose.yml tiwap/docker-compose.yml
    - sed -i "s/app.run(host='0.0.0.0', port=5000, debug=True, ssl_context=context)/app.run(host='0.0.0.0', port=5000, debug=True)/" tiwap/app.py
    - mkdir -p tiwap/reports
  script:
    - cd tiwap
    - docker compose config
    - docker compose up -d --build
    - |
      for attempt in $(seq 1 30); do
        if docker compose exec -T zap wget -qO- http://app:5000/ >/dev/null; then exit 0; fi
        sleep 2
      done
      echo "TIWAP is not reachable from the Compose network" >&2
      exit 1
    # ZAP stable 2.17 resolves an absolute report name below /zap/wrk twice.
    # A relative name creates the requested files in the mounted reports directory.
    - |
      set +e
      docker compose exec -T zap zap-baseline.py -t http://app:5000 -m 2 -r zap-report.html -J zap-report.json
      zap_exit=$?
      set -e
      test "$zap_exit" -eq 0 -o "$zap_exit" -eq 2 || exit "$zap_exit"
      echo "ZAP baseline exit code: $zap_exit (0=no alert, 2=warnings found)"
  after_script:
    - cd tiwap && docker compose down -v || true
  artifacts:
    when: always
    expire_in: 30 days
    paths:
      - tiwap/reports/zap-report.html
      - tiwap/reports/zap-report.json
